[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gist-memory"
version = "0.1.0"
description = "Gist Memory: Biomimetic Constructive Associative Memory for Language Models"
readme = "README.md"
authors = [
    { name = "batteryphil", email = "batteryphil@users.noreply.github.com" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "deep-learning",
    "transformers",
    "linear-attention",
    "associative-memory",
    "state-space-models",
    "long-context",
    "kv-cache-compression",
    "gist-memory",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
]
dev = [
    "pytest>=7.0.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]
